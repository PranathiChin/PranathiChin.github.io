  <script>
    (function () {
      var REPO_PHOTOS = [
        "photos/1.jpg",
        "photos/2.JPG",
        "photos/4.JPG",
        "photos/5.JPG",
        "photos/6.JPG",
        "photos/7.JPG"
      ];

      var LAYOUT = [
        { left: "4%", top: "10%", rotate: -7, z: 3 },
        { left: "26%", top: "4%", rotate: 5.5, z: 5 },
        { left: "48%", top: "14%", rotate: -4.5, z: 4 },
        { left: "10%", top: "44%", rotate: 6, z: 6 },
        { left: "34%", top: "48%", rotate: -5.5, z: 7 },
        { left: "52%", top: "52%", rotate: 3.5, z: 2 }
      ];

      var CAPTION_WORDS = [
        "New York (NYU)",
        "Orlando, Fl",
        "new hat",
        "Seattle, WA",
        "Hometown",
        "Go Gators"
      ];

      var root = document.getElementById("polaroid-scatter");
      var zStack = 100;

      REPO_PHOTOS.forEach(function (path, i) {
        var L = LAYOUT[i] || { left: "10%", top: "10%", rotate: 0, z: 1 };
        var cell = document.createElement("div");
        cell.className = "scatter-cell";
        cell.style.left = L.left;
        cell.style.top = L.top;
        cell.style.zIndex = String(L.z);

        cell.addEventListener("mouseenter", function () {
          zStack += 1;
          cell.style.zIndex = String(zStack);
        });

        var card = document.createElement("div");
        card.className = "polaroid";
        card.style.setProperty("--tilt", L.rotate + "deg");

        var img = document.createElement("img");
        img.src = path;
        img.alt = "";
        img.loading = i < 2 ? "eager" : "lazy";

        var cap = document.createElement("div");
        cap.className = "polaroid-caption";
        cap.textContent = CAPTION_WORDS[i] || String(i + 1);
        cap.style.transform = "rotate(" + (Math.random() * 5 - 2.5).toFixed(2) + "deg)";

        card.appendChild(img);
        card.appendChild(cap);

        cell.appendChild(card);
        root.appendChild(cell);
      });
    })();
  </script>
</body>
