<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Art — Pran</title>
  <link rel="stylesheet" href="assets/css/site.css" />
  <link rel="stylesheet" href="assets/css/art.css" />
</head>
<body class="art-body">

  <div class="corner"><a href="index.html">pran.studio</a></div>

  <main class="art-main">

    <header class="art-header">
      <span class="section-tag">sketchbook.png</span>
      <div class="header-right">
        <span class="card-counter" id="card-counter">01 / 08</span>
      </div>
    </header>

    <div class="carousel-scene" id="carousel-scene">
      <div class="carousel-track" id="carousel-track"></div>

      <button class="carousel-btn btn-prev" id="btn-prev" aria-label="Previous">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M11 3L5 9L11 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="carousel-btn btn-next" id="btn-next" aria-label="Next">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M7 3L13 9L7 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <footer class="art-footer">
      <div class="dots" id="dots"></div>
      <span class="card-caption" id="card-caption"></span>
    </footer>

  </main>

  <script src="assets/js/transition.js" defer></script>
  <script src="assets/js/art.js"></script>
  <script>
    // Use the shared dot-burst exit when leaving back to the home page.
    document.querySelector(".corner a")?.addEventListener("click", (e) => {
      if (!window.PageTransition) return;
      e.preventDefault();
      window.PageTransition.exit(
        e.currentTarget.getAttribute("href"),
        e.clientX,
        e.clientY,
        "pran.studio"
      );
    });
  </script>
</body>
</html>
